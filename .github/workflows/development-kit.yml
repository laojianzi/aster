name: Development kit

on:
  push:
    branches: [build/development-kit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
          cache: true
      - name: Resolve the pinned public dependency graph
        run: go mod download
      - name: Package source and toolchain without runner credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kit
          git archive --format=tar HEAD | gzip -n > kit/source.tar.gz
          printf '%s\n' "$(git rev-parse HEAD)" > kit/source-commit.txt
          go version > kit/toolchain.txt
          tar -C "$(go env GOROOT)" -czf kit/goroot.tar.gz .
          tar -C "$(go env GOMODCACHE)" -czf kit/modules.tar.gz .
          (cd kit && sha256sum *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: offline-development-kit
          path: kit/
          compression-level: 0
          retention-days: 3
