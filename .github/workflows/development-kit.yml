name: Development kit
on:
  push:
    branches: [build/development-kit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
          cache: true
      - name: Download exact upstream streaming test dependency
        run: go mod download github.com/armon/go-socks5@v0.0.0-20160902184237-e75332964ef5
      - name: Export public module and its download metadata only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kit
          tar -C "$(go env GOMODCACHE)" -czf kit/modules.tar.gz github.com/armon cache/download/github.com/armon
          (cd kit && sha256sum modules.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: stream-dependency-supplement
          path: kit/
          retention-days: 3
