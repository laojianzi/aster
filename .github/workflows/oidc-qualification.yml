name: OIDC qualification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: oidc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dex-kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTER_OIDC_E2E: '1'
      ASTER_TEST_ARTIFACTS: ${{ github.workspace }}/artifacts/oidc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
      - name: Prepare verified native code and library
        run: python scripts/prepare_terminal.py --github-env "$GITHUB_ENV"
      - name: Install pinned cluster runner
        run: |
          go install sigs.k8s.io/kind@v0.33.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Protocol, native and independent provider qualification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/oidc
          go version > artifacts/oidc/environment.txt
          git rev-parse HEAD >> artifacts/oidc/environment.txt
          python scripts/oidc_bootstrap_probe.py go test -race -count=1 -tags=e2e,oidce2e -timeout=4m -json ./internal/oidclogin ./internal/ui -run '^(TestOIDC|TestNativeOIDC)' | tee artifacts/oidc/tests.jsonl
          python scripts/test_evidence.py artifacts/oidc/tests.jsonl --suite oidc-dex-real-kubernetes --require TestOIDCKeyMaterialBudgetsBeforeCryptoParsing --require TestOIDCCodePKCEAndSingleUseIdentity --require TestOIDCRejectsClaimAndSignatureConfusion --require TestOIDCDiscoveryRejectsUnreviewedEndpoints --require TestOIDCInterruptedExchangeNeverReplays --require TestOIDCCallbackRejectsForgeryAndClosesOnCancel --require TestOIDCJSONBudgetsAndDuplicateSecurityClaims --require TestOIDCIdentityCannotCrossTargetOrExpiry --require TestOIDCTransportRejectsRedirectCompressionAndOversize --require TestNativeOIDCReviewConfirmationAndMinimumWindow --require TestNativeOIDCConnectExpiryAndKubeconfigUnchanged --require TestNativeOIDCCancelAndTargetChangeInvalidateCallbacks --require TestNativeOIDCChangedKubeconfigCannotRetargetIdentity --require TestNativeOIDCWindowCloseCancelsPendingFlow --require TestNativeOIDCBrowserDispatchUsesPersistentServicesOnce --require TestNativeOIDCWithDexAndRealKubernetes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: oidc-provider-evidence
          path: artifacts/oidc/
          if-no-files-found: error
          retention-days: 14
