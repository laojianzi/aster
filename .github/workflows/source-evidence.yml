name: Source evidence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Archive exact tracked source and record identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/COMMIT
          git archive --format=tar.gz --prefix=aster/ HEAD > evidence/aster-source.tar.gz
          sha256sum evidence/aster-source.tar.gz > evidence/SHA256SUMS
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Prepare hash-verified native terminal source and library
        shell: bash
        run: python scripts/prepare_terminal.py --github-env "$GITHUB_ENV"
      - name: Resolve module metadata for review, without committing changes
        shell: bash
        run: |
          set -euo pipefail
          cp .aster-native/provenance.json evidence/terminal-provenance.json
          tar -czf evidence/generated-terminal.tar.gz internal/nativeterm/upstream
          go mod tidy
          mkdir -p evidence/resolved
          cp go.mod go.sum evidence/resolved/
          git diff -- go.mod go.sum > evidence/module-metadata.patch
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: source-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 14
