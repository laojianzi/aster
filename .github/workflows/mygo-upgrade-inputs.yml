name: MyGo upgrade inputs
# Review-only snapshot, not a replacement for any application acceptance gate.
on:
  push:
    branches: ['renovate/mygo-native-framework']
    paths: ['.github/workflows/mygo-upgrade-inputs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
      - name: Retain only the two required public module snapshots
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/mygo-transitive"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/ASTER_COMMIT"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          for spec in golang.org/x/net@v0.59.0 golang.org/x/text@v0.43.0; do
            name=${spec##*/}
            go mod download -json "$spec" > "$out/$name.json"
            file=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["Zip"])' "$out/$name.json")
            cp "$file" "$out/$name.zip"
          done
          cd "$out"
          sha256sum *.json *.zip ASTER_COMMIT > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mygo-transitive-review-inputs
          path: mygo-transitive/
          if-no-files-found: error
          retention-days: 2
