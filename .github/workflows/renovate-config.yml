name: Renovate configuration
on:
  pull_request:
    paths: [renovate.json, .github/workflows/renovate-config.yml, scripts/check_dependency_extraction.py, scripts/test_dependency_dashboard.py, third_party/native-terminal/UPSTREAM.json, go.mod]
  push:
    branches: [main]
    paths: [renovate.json, .github/workflows/renovate-config.yml, scripts/check_dependency_extraction.py, scripts/test_dependency_dashboard.py, third_party/native-terminal/UPSTREAM.json, go.mod]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate configuration and upstream presets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/environment.txt
          node --version >> artifacts/environment.txt
          npm --version >> artifacts/environment.txt
          npx --yes --package=renovate@44.148.3 renovate-config-validator --strict renovate.json 2>&1 | tee artifacts/renovate-validation.log
      - name: Dashboard contract regressions
        run: python -m unittest discover -s scripts -p 'test_dependency_dashboard.py'
      - name: Real Renovate extraction without repository writes
        shell: bash
        env:
          LOG_LEVEL: info
          LOG_FILE_LEVEL: info
          LOG_FILE: artifacts/renovate-extraction.jsonl
        run: |
          set -euo pipefail
          npx --yes --package=renovate@44.148.3 renovate --platform=local --dry-run=extract > artifacts/renovate-extraction-console.txt 2>&1
          python scripts/check_dependency_extraction.py artifacts/renovate-extraction.jsonl > artifacts/dependency-extraction-summary.json
          git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: renovate-config-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
