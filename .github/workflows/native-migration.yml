name: Native migration verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: native-migration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
      - run: python scripts/prepare_terminal.py
      - name: The exact pinned codemod must not alter any Go source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/COMMIT
          python scripts/check_mygo_migration.py | tee artifacts/migration.log
          git diff --exit-code -- go.mod go.sum '*.go'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: migration-source-audit
          path: artifacts/
  native-regressions:
    needs: source-audit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      ASTER_TEST_ARTIFACTS: ${{ github.workspace }}/artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
      - name: Prepare pinned native source and library
        shell: bash
        run: python scripts/prepare_terminal.py --github-env "$GITHUB_ENV"
      - name: Mandatory ordinary and production-tag migration regressions
        run: python scripts/run_migration_tests.py
      - name: Build the production-tag desktop
        shell: bash
        run: |
          mkdir -p dist
          binary=aster
          if [[ "$RUNNER_OS" == Windows ]]; then binary=aster.exe; fi
          go build -trimpath -tags=mygo_noinspector -o "dist/$binary" ./cmd/aster
          cp "$ASTER_TEST_LIBRARY" dist/
          cp .aster-native/provenance.json dist/terminal-provenance.json
      - name: Linux display prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libgl1-mesa-dri libegl1 libfontconfig1 fonts-dejavu-core
      - name: Production-tag real-window smoke
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a -s '-screen 0 1600x1000x24' python3 scripts/window_smoke.py dist/aster artifacts/window-production.log
          elif [[ "$RUNNER_OS" == Windows ]]; then
            python scripts/window_smoke.py dist/aster.exe artifacts/window-production.log
          else
            python3 scripts/window_smoke.py dist/aster artifacts/window-production.log
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: migration-${{ matrix.os }}
          path: |
            artifacts/
            dist/
          retention-days: 14
