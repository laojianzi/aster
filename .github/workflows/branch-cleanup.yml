name: Reviewed branch cleanup
on:
  workflow_run:
    workflows: [CI, Source evidence, Native migration verification]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: reviewed-branch-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Execute only the reviewed, exact-SHA plan after main CI
        env:
          GH_TOKEN: ${{ github.token }}
          ASTER_CLEANUP_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/branch_cleanup.py --apply
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: branch-cleanup-evidence
          path: artifacts/branch-cleanup/
          retention-days: 90
