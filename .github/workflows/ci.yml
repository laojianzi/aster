name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go test / race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true
      - name: Download modules
        run: go mod download
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...

  kind-e2e:
    name: kind e2e / Kubernetes ${{ matrix.k8s }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s: ["v1.35.0", "v1.36.0", "v1.37.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true
      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@v0.30.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Create cluster
        run: kind create cluster --image "kindest/node:${{ matrix.k8s }}" --wait 120s
      - name: Cluster diagnostics
        run: kubectl version && kubectl get nodes -o wide
      - name: E2E
        run: go test -tags=e2e ./e2e/... -count=1 -timeout=10m
