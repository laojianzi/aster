name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit, race and native interactions
    runs-on: ubuntu-latest
    # Keep complete race and coverage evidence in one job, including cold builds.
    # This runner budget does not increase any test or application deadline.
    timeout-minutes: 20
    env:
      ASTER_TEST_ARTIFACTS: ${{ github.workspace }}/artifacts/unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - name: Prepare hash-verified native terminal source and library
        shell: bash
        run: python scripts/prepare_terminal.py --github-env "$GITHUB_ENV"
      - name: Prepare approved Helm and preserve original tool archive
        shell: bash
        run: python scripts/prepare_helm.py --github-env "$GITHUB_ENV" --evidence-dir artifacts/unit/helm --archive-evidence
      - name: Record environment and verify modules
        run: |
          mkdir -p artifacts/unit
          go version > artifacts/unit/environment.txt
          git rev-parse HEAD >> artifacts/unit/environment.txt
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Native UI lifetime analysis
        shell: bash
        run: |
          set -euo pipefail
          mygo_version=$(go list -m -f '{{.Version}}' github.com/egoist/mygo)
          go run github.com/egoist/mygo/cmd/mygo@"$mygo_version" vet .
      - name: Build provenance and evidence validator regressions
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Unit, native interaction and race tests
        shell: bash
        run: |
          set -o pipefail
          # Keep external-process integration packages from competing with other
          # test binaries for runner CPU. Package tests still use -race and their
          # existing internal concurrency; no test or operation deadline changes.
          go test -race -shuffle=on -count=1 -timeout=5m -p=1 -json ./... | tee artifacts/unit/tests.jsonl
      - name: Validate test evidence
        run: |
          python3 -m unittest discover -s scripts -p "test_*.py"
          python3 scripts/test_evidence.py artifacts/unit/tests.jsonl --suite unit-native --require TestSchemaListSetStringEquality --require TestSchemaListSetMatchesIndependentStringOracle --require TestSchemaListSetRejectsMalformedAndUnsupported --require TestSchemaListSetBudgetsAndCancellation --require TestSchemaListSetInspectionPreservesInputsAndPrivacy --require TestNativeSchemaListSetPreservesDraftAndHistory --require TestNativeSchemaListSetMinimumWindowAndIncomplete --require TestSchemaListMapStringKeyIdentity --require TestSchemaListMapMatchesIndependentTupleOracle --require TestSchemaListMapRejectsMalformedAndUnsupported --require TestSchemaListMapBudgetsAndCancellation --require TestSchemaListMapInspectionPreservesInputsAndPrivacy --require TestNativeSchemaListMapPreservesDraftAndHistory --require TestNativeSchemaListMapMinimumWindowAndIncomplete --require TestSchemaEnumStructuredEquality --require TestSchemaEnumMatchesIndependentJSONOracle --require TestSchemaEnumRejectsMalformedAndInapplicable --require TestSchemaEnumBudgetsAndCancellation --require TestSchemaEnumInspectionPreservesInputsAndPrivacy --require TestNativeSchemaEnumPreservesDraftAndHistory --require TestNativeSchemaEnumMinimumWindowAndIncomplete --require TestSchemaFormatSupportedStringValues --require TestSchemaFormatMatchesIndependentExpectations --require TestSchemaFormatRejectsMalformedAndInapplicable --require TestSchemaFormatBudgetsAndCancellation --require TestSchemaFormatInspectionPreservesInputsAndPrivacy --require TestNativeSchemaFormatPreservesDraftAndHistory --require TestNativeSchemaFormatMinimumWindowAndIncomplete --require TestSchemaPatternPortableMatching --require TestSchemaPatternMatchesIndependentFiniteLanguages --require TestSchemaPatternRejectsMalformedAndUnsupported --require TestSchemaPatternBudgetsAndCancellation --require TestSchemaPatternInspectionPreservesInputsAndPrivacy --require TestNativeSchemaPatternPreservesDraftAndHistory --require TestNativeSchemaPatternMinimumWindowAndIncomplete --require TestSchemaMultipleOfExactDecodedValues --require TestSchemaMultipleOfMatchesIndependentRationalOracle --require TestSchemaMultipleOfRejectsMalformedAndInapplicable --require TestSchemaMultipleOfBudgetsAndCancellation --require TestSchemaMultipleOfInspectionPreservesInputsAndPrivacy --require TestNativeSchemaMultipleOfPreservesNumbersAndHistory --require TestNativeSchemaMultipleOfMinimumWindowAndIncomplete --require TestOperationLookupUsesBoundServiceAndReturnsOwnedIdentity --require TestOperationLookupRejectsChangedIdentityAndPreservesReadFailures --require TestManifestDeliveryParseResolvesOrderedImmutableTargets --require TestManifestDeliveryParseRejectsAmbiguousOrUnsafeInput --require TestManifestDeliveryParseBudgetsCancellationAndPrivacy --require TestManifestDeliveryPrepareUsesSameServiceCreateAndApply --require TestManifestDeliveryPrepareRejectsReadFailuresAndChangedIdentity --require TestManifestDeliveryPreparedOperationsRemainBoundAndSingleUse --require TestNativeDeliveryImportPreviewAndConfirm --require TestNativeDeliveryPartialUnknownAndReviewAgain --require TestNativeDeliveryStaleWorkAndWorkspaceIsolation --require TestNativeDeliveryMinimumWindowUnicodeAndBudget --require TestSchemaScalarEnumExactEqualityAndNullable --require TestSchemaNumericBoundsUseExactDecodedValues --require TestSchemaConstraintLengthsCountUnicodeAndContainers --require TestSchemaConstraintsRejectMalformedAndUnsupportedWithoutGuessing --require TestSchemaConstraintKeywordApplicability --require TestSchemaIntOrStringOnlyAcceptsCanonicalUnion --require TestSchemaConstraintBudgetsCancelAndPrivacy --require TestSchemaConstraintInspectionDoesNotMutateInputs --require TestNativeSchemaConstraintsPreserveNumbersDraftAndHistory --require TestNativeSchemaConstraintsMinimumWindowAndNoValueDisclosure --require TestManifestBufferImmutableConcurrentSnapshotsAndExportBounds --require TestManifestBufferIdleRevisionChecksAllocateNothing --require TestNativeManifestBufferStableIdentitySnapshotAndUndo --require TestNativeManifestBufferPreeditNoOpPreservesSemanticRevision --require TestNativeManifestBufferQueuedSchemaSeesUnrenderedEdit --require TestNativeManifestBufferUnrenderedChangeRevokesPreparedPlan --require TestNativeManifestBufferOversizeCannotBecomeEmptyPreview --require TestNativeManifestBufferOversizeIsPreservedUntilExplicitRestore --require TestNativeFindLiteralNavigationUndoAndWrap --require TestNativeFindQueuedResultsCannotCrossEpochs --require TestNativeFindSingleAdmissionAndOneShotSelection --require TestNativeFindCompositionDefersAndRejectsChangedDraft --require TestNativeFindReadOnlyBudgetsAndMinimumWindow --require TestNativeFindQueuedSelectionCannotCrossDraftOrQuery --require TestNativeFindDeferredSelectionLosesFocusAndPreservesTruncation --require TestFindLiteralUnicodeCoordinatesAndExactRanges --require TestFindLiteralLimitsCancellationAndTruncation --require TestFindLiteralLinearAdversarialPrefix --require TestSourceIndexUnicodeCRLFAndJSONPositions --require TestSourceIndexBudgetsAndCancellation --require TestSourceIndexRejectsAmbiguousAndUnsupportedInput --require TestNativeSchemaDiagnosticNavigationPreservesDraftAndHistory --require TestNativeSchemaLocationControlsAtMinimumWindow --require TestSchemaLocationDisplayBudgetAndNoValueDisclosure --require TestVaultBindingRejectsMixedAndUnsafeIdentities --require TestVaultRecordStrictnessExpiryAndBoundedToken --require TestVaultHelperRejectsAmbiguousInputAndSanitizesFailures --require TestNativeVaultCAFileChangeInvalidatesReviewedTarget --require TestNativeVaultUncertainStatusAtMinimumWindow --require TestNativeVaultSubmissionCannotUndoTokenHistory --require TestNativeVaultRequiresExplicitConfirmationAndErasesInput --require TestNativeVaultCancellationKeepsAdmissionUntilJoined --require TestApplicationHelperPipeBudgetsAndCancellation --require TestSchemaFieldHelpAndStructuralHints --require TestSchemaStrictParsingAndBudgets --require TestSchemaRejectsHostPathAndQueryInjection --require TestSchemaDecodedSizeAndCancellation --require TestNativeSchemaQueuedResultsCannotCrossIdentityOrDraft --require TestNativeSchemaForbiddenRemainsPermissionError --require TestExecCredentialProcessTreeIsReclaimed --require TestExecCredentialOutputBudgetsDeadlineAndCancellation --require TestNativeExecAuthenticationTrustExpiryAndNoRefresh --require TestNativeExecAuthenticationCancellationAndSingleAdmission --require TestTerminalNativeRemoteLinksCannotLaunchLocalApplications --require TestTerminalNativePasteCannotBypassInputBudget --require TestTerminalInputBudgetClosesRatherThanSilentlyDropping --require TestTerminalNativeUnicodeInputAndOSC52CannotWriteClipboard --require TestTTYProtocolFailuresNeverReplayOrLeakArguments --require TestTTYCloseUnblocksBothDirectionsAndJoins --require TestNativeTerminalMinimumWindowAndConfirmation --require TestApplyPinsReviewedIdentityAndNeverForces --require TestApplyRejectsUnsafeOrAmbiguousIntent --require TestNativeApplyCloseCancelsDryRun --require TestNativeNavigationAndUnicodeInput --require TestDetailActionsStayInsideMinimumWindow --require TestNativeCommandRequiresConfirmationAndDoesNotInterpretShell --require TestRemoteExitIsSeparateFromDisconnection --require TestExecDenialDoesNotFallBackOrExposeCommandArguments --require TestCredentialedReadsDoNotFollowRedirects --require TestMutationRetryAfterNeverReplays --require TestRelationshipsDependentsUseUIDNotLabels --require TestRelationshipsNeverFetchSecretContents --require TestNativeRelationshipsNavigateAndRevalidateIdentity --require TestNativeRelationshipsDiscardQueuedResultsAfterDetailChange --require TestMetricsDecodeQuantitiesAndMissingIsNotZero --require TestMetricsTransportNeverRedirectsAndCancels --require TestNativeMetricsQueuedResultsCannotCrossDetails --require TestWorkspaceCloseIsIndependentAndChurnIsBounded --require TestWorkspaceSlotReuseRejectsOldCallbacks --require TestNativeLoadingContextsRequiresExplicitConnect --require TestNativeWorkspacesKeepCredentialsDataAndCancellationSeparate --require TestOIDCJOSE416RSAAndES256Compatibility --require TestOIDCJOSE416RejectsPrivateAndEmbeddedKeys
          python3 scripts/helm_uninstall_contract_evidence.py artifacts/unit/tests.jsonl --suite unit-native
      - name: Bounded source-index fuzz regression
        run: go test -run '^$' -fuzz '^FuzzSourceIndexLocations$' -fuzztime=10s -parallel=2 ./internal/manifest > artifacts/unit/source-fuzz.txt
      - name: Bounded literal-find fuzz regression
        run: go test -run '^$' -fuzz '^FuzzFindLiteralRanges$' -fuzztime=10s -parallel=2 ./internal/manifest > artifacts/unit/find-fuzz.txt
      - name: Measure bounded manifest buffer allocations
        shell: bash
        run: go test ./internal/ui -run '^$' -bench '^BenchmarkManifestBuffer' -benchtime=100x -benchmem | tee artifacts/unit/manifest-buffer-bench.txt
      - name: Coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/unit/coverage
          go test -coverprofile=artifacts/unit/coverage.out -json ./... 2>artifacts/unit/coverage/stderr.log | tee artifacts/unit/coverage/tests.jsonl
          python3 scripts/helm_uninstall_contract_evidence.py artifacts/unit/coverage/tests.jsonl --suite unit-native
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-evidence
          path: artifacts/unit
          retention-days: 14

  desktop-build:
    name: Native build and window smoke / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: aster
          - os: macos-latest
            binary: aster
          - os: windows-latest
            binary: aster.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      ASTER_TEST_ARTIFACTS: ${{ github.workspace }}/artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - name: Prepare hash-verified native terminal source and library
        shell: bash
        run: python scripts/prepare_terminal.py --github-env "$GITHUB_ENV"
      - name: Prepare approved Helm for actual native rendering
        shell: bash
        run: python scripts/prepare_helm.py --github-env "$GITHUB_ENV" --evidence-dir artifacts/helm
      - name: Install Linux credential provider for isolated OS tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-0 gnome-keyring dbus-x11 libglib2.0-bin
      - name: Actual OS credential storage roundtrip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/vault
          git rev-parse HEAD > artifacts/vault/environment.txt
          python scripts/with_test_vault.py go test -race -tags=osvault -count=1 -timeout=3m -json ./internal/credentialvault | tee artifacts/vault/tests.jsonl
          python scripts/test_evidence.py artifacts/vault/tests.jsonl --suite actual-os-vault --require TestOSCredentialStoreRoundTripAcrossProcesses
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            python scripts/test_evidence.py artifacts/vault/tests.jsonl --suite actual-os-vault --require TestOSVaultLockedDefaultKeychainFailsClosed
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            python scripts/test_evidence.py artifacts/vault/tests.jsonl --suite actual-os-vault --require TestOSVaultUnavailableSessionBusFailsClosed
          fi
      - name: Native interaction tests on this OS
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          go version > artifacts/environment.txt
          git rev-parse HEAD >> artifacts/environment.txt
          go test -count=1 -timeout=5m -json ./internal/ui/... ./internal/nativeterm/... ./internal/credentialexec/... | tee artifacts/tests.jsonl
          python scripts/test_evidence.py artifacts/tests.jsonl --suite native-os-interactions --require TestNativeSchemaListSetPreservesDraftAndHistory --require TestNativeSchemaListSetMinimumWindowAndIncomplete --require TestNativeSchemaListMapPreservesDraftAndHistory --require TestNativeSchemaListMapMinimumWindowAndIncomplete --require TestNativeSchemaEnumPreservesDraftAndHistory --require TestNativeSchemaEnumMinimumWindowAndIncomplete --require TestNativeSchemaFormatPreservesDraftAndHistory --require TestNativeSchemaFormatMinimumWindowAndIncomplete --require TestNativeSchemaPatternPreservesDraftAndHistory --require TestNativeSchemaPatternMinimumWindowAndIncomplete --require TestNativeSchemaMultipleOfPreservesNumbersAndHistory --require TestNativeSchemaMultipleOfMinimumWindowAndIncomplete --require TestNativeDeliveryImportPreviewAndConfirm --require TestNativeDeliveryPartialUnknownAndReviewAgain --require TestNativeDeliveryStaleWorkAndWorkspaceIsolation --require TestNativeDeliveryMinimumWindowUnicodeAndBudget --require TestNativeSchemaConstraintsPreserveNumbersDraftAndHistory --require TestNativeSchemaConstraintsMinimumWindowAndNoValueDisclosure --require TestManifestBufferImmutableConcurrentSnapshotsAndExportBounds --require TestManifestBufferIdleRevisionChecksAllocateNothing --require TestNativeManifestBufferStableIdentitySnapshotAndUndo --require TestNativeManifestBufferPreeditNoOpPreservesSemanticRevision --require TestNativeManifestBufferQueuedSchemaSeesUnrenderedEdit --require TestNativeManifestBufferUnrenderedChangeRevokesPreparedPlan --require TestNativeManifestBufferOversizeCannotBecomeEmptyPreview --require TestNativeManifestBufferOversizeIsPreservedUntilExplicitRestore --require TestNativeFindLiteralNavigationUndoAndWrap --require TestNativeFindQueuedResultsCannotCrossEpochs --require TestNativeFindSingleAdmissionAndOneShotSelection --require TestNativeFindCompositionDefersAndRejectsChangedDraft --require TestNativeFindReadOnlyBudgetsAndMinimumWindow --require TestNativeFindQueuedSelectionCannotCrossDraftOrQuery --require TestNativeFindDeferredSelectionLosesFocusAndPreservesTruncation --require TestNativeVaultControlsAtMinimumWindow --require TestNativeVaultCAFileChangeInvalidatesReviewedTarget --require TestNativeVaultUncertainStatusAtMinimumWindow --require TestNativeVaultSubmissionCannotUndoTokenHistory --require TestNativeVaultRequiresExplicitConfirmationAndErasesInput --require TestExecCredentialProcessTreeIsReclaimed --require TestExecCredentialOutputBudgetsDeadlineAndCancellation --require TestNativeExecAuthenticationTrustExpiryAndNoRefresh --require TestNativeExecAuthenticationCancellationAndSingleAdmission --require TestNativeTerminalMinimumWindowAndConfirmation --require TestTerminalNativeUnicodeInputAndOSC52CannotWriteClipboard --require TestTerminalNativeRemoteLinksCannotLaunchLocalApplications --require TestTerminalNativePasteCannotBypassInputBudget --require TestTerminalInputBudgetClosesRatherThanSilentlyDropping --require TestNativeApplyControlsAtMinimumWindow --require TestNativeApplyAcknowledgmentReviewAndDraftIsolation --require TestNativeWorkspaceControlsAtMinimumWindow --require TestNativeNewWorkspaceDoesNotCopyIdentityOrPreparedState --require TestNativeRelationshipsNavigateAndRevalidateIdentity --require TestNativeRelationshipsCloseCancelsOutstandingRead --require TestNativeMetricsControlsStayInsideMinimumWindow --require TestNativeMetricsReadOnlyAndTabLifecycle --require TestNativeNavigationAndUnicodeInput --require TestDetailActionsStayInsideMinimumWindow --require TestNativeCommandRequiresConfirmationAndDoesNotInterpretShell --require TestNativeSchemaReadOnlyDraftAndTabLifecycle --require TestNativeSchemaControlsAtMinimumWindow --require TestNativeSchemaTabChangeCancelsRequest
      - name: Build native desktop
        shell: bash
        run: |
          go build -trimpath -o dist/${{ matrix.binary }} ./cmd/aster
          cp "$ASTER_TEST_LIBRARY" dist/
          cp .aster-native/provenance.json dist/terminal-provenance.json
          mkdir -p dist/licenses
          cp third_party/native-terminal/LICENSE.* dist/licenses/
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libgl1-mesa-dri libegl1 libfontconfig1 fonts-dejavu-core
      - name: Linux real-window smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1600x1000x24' python3 scripts/window_smoke.py dist/aster artifacts/window.log
      - name: macOS real-window smoke
        if: runner.os == 'macOS'
        run: python3 scripts/window_smoke.py dist/aster artifacts/window.log
      - name: Windows real-window smoke
        if: runner.os == 'Windows'
        run: python scripts/window_smoke.py dist/aster.exe artifacts/window.log
      - name: Upload development binary and smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.os }}
          path: |
            dist/
            artifacts/
          retention-days: 14

  kind-e2e:
    name: Real cluster and native E2E / ${{ matrix.k8s }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTER_TEST_ARTIFACTS: ${{ github.workspace }}/artifacts/e2e
      ASTER_E2E_CONTEXT: kind-aster-e2e
      ASTER_E2E_ALLOW_DESTRUCTIVE: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - k8s: 'v1.35.8'
            image: 'kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0'
          - k8s: 'v1.36.4'
            image: 'kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed'
          - k8s: 'v1.37.0'
            image: 'kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - name: Prepare hash-verified native terminal source and library
        shell: bash
        run: python scripts/prepare_terminal.py --github-env "$GITHUB_ENV"
      - name: Prepare approved Helm for real-cluster delivery
        shell: bash
        run: python scripts/prepare_helm.py --github-env "$GITHUB_ENV" --evidence-dir artifacts/e2e/helm
      - name: Initialize isolated kubeconfig path
        shell: bash
        run: echo "KUBECONFIG=$RUNNER_TEMP/aster-e2e-kubeconfig" >> "$GITHUB_ENV"
      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@v0.33.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Create isolated cluster
        run: kind create cluster --name aster-e2e --kubeconfig "$KUBECONFIG" --image '${{ matrix.image }}' --wait 120s
      - name: Install verified metrics-server in disposable kind only
        run: bash scripts/install-e2e-metrics.sh
      - name: Install isolated Linux OS credential provider
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-0 gnome-keyring dbus-x11 libglib2.0-bin
      - name: E2E including native UI against the real API server
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/e2e
          kubectl version > artifacts/e2e/environment.txt
          git rev-parse HEAD >> artifacts/e2e/environment.txt
          python scripts/with_test_vault.py go test -race -tags=e2e,osvault -shuffle=on -count=1 -timeout=12m -json ./e2e/... ./internal/ui/... | tee artifacts/e2e/tests.jsonl
          go test -race -tags=e2e -shuffle=on -run '^TestRealHelmUninstallContractResourcesAndHistory$' -count=1 -timeout=12m -json ./internal/helmrender/... | tee -a artifacts/e2e/tests.jsonl
      - name: Validate real-cluster evidence
        run: |
          python3 scripts/test_evidence.py artifacts/e2e/tests.jsonl --suite real-cluster-native --require TestRealSchemaListSetAgreeWithDryRun --require TestNativeSchemaListSetAgainstRealCluster --require TestRealSchemaListMapAgreeWithDryRun --require TestNativeSchemaListMapAgainstRealCluster --require TestRealSchemaEnumAgreeWithDryRun --require TestNativeSchemaEnumAgainstRealCluster --require TestRealSchemaFormatAgreeWithDryRun --require TestNativeSchemaFormatAgainstRealCluster --require TestRealSchemaPatternAgreeWithDryRun --require TestNativeSchemaPatternAgainstRealCluster --require TestRealSchemaMultipleOfAgreeWithDryRun --require TestNativeSchemaMultipleOfAgainstRealCluster --require TestRealManifestDeliveryReviewedSetSafety --require TestNativeManifestDeliveryAgainstRealCluster --require TestNativeSchemaConstraintsAgainstRealCluster --require TestRealSchemaConstraintsAgreeWithDryRun --require TestNativeFindCorrectionUndoAgainstRealCluster --require TestNativeOSStoredTokenIdentityAndExpiryAgainstRealCluster --require TestRealSchemaBuiltinsAndReadOnlyAssistance --require TestRealSchemaDiscoveryAuthorizationIsIndependent --require TestRealSchemaStructuralCRDAndPreservedFields --require TestNativeSchemaDiagnosticNavigationAgainstRealCluster --require TestNativeSchemaAssistanceAgainstRealCluster --require TestRealExecCredentialTrustRBACAndExpiry --require TestNativeExecCredentialLiveLogsExpireAgainstRealCluster --require TestRealTTYInteractiveInputResizeAndExit --require TestRealTTYCancelAndLeaseDoNotInventExit --require TestRealTTYReadOnlyRBACPreventsExecution --require TestNativeTTYInputAndLifecycleAgainstRealCluster --require TestRealApplySharedOwnershipWithoutValueChanges --require TestRealApplyStructuralCRDListOwnershipAndStrictValidation --require TestRealApplyOwnershipDryRunOmissionAndConflict --require TestRealApplyPreconditionsPreventRecreationAndReplacementWrites --require TestRealApplyCommittedResponseLossIsUnknownWithoutReplay --require TestRealApplyRejectsReadOnlyIdentity --require TestNativeApplyReviewAgainstRealCluster --require TestNativeWorkbenchEditAgainstRealCluster --require TestNativeLogsAndPortForwardLifecycle --require TestNativeScaleTracksActualReadiness --require TestReviewedScaleThenRealControllerReadiness --require TestNativePodCommandLifecycleAgainstRealCluster --require TestRealPodCommandExitOutputAndNoImplicitShell --require TestRealPodCommandRejectsReadOnlyIdentity --require TestRealPodCommandCancellationDoesNotInventAnExitCode --require TestRealPodCommandDeadlineDoesNotClaimTermination --require TestRealCommittedMutationsAreUnknownAndNeverReplayed --require TestRealWorkloadRelationshipsRespectUIDAndSelectors --require TestRealRelationshipsReportRBACPartialResults --require TestNativeRelationshipNavigationToPodForwardAgainstRealCluster --require TestRealMetricsPodNodeAndIndependentRBAC --require TestNativeMetricsAgainstRealServerAndTeardown
          python3 scripts/helm_uninstall_contract_evidence.py artifacts/e2e/tests.jsonl --suite real-cluster-native
      - name: Collect cluster diagnostics
        if: always()
        run: |
          mkdir -p artifacts/e2e
          kubectl get pods -A -o wide > artifacts/e2e/pods.txt 2>&1 || true
          kubectl get events -A > artifacts/e2e/events.txt 2>&1 || true
      - name: Delete isolated cluster
        if: always()
        run: kind delete cluster --name aster-e2e
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.k8s }}
          path: artifacts/e2e
          retention-days: 14

  multi-cluster-e2e:
    name: Two independent clusters / native workspace isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTER_E2E_ALLOW_DESTRUCTIVE: "1"
      ASTER_TEST_ARTIFACTS: ${{ github.workspace }}/artifacts/multicluster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - name: Prepare hash-verified native terminal source and library
        shell: bash
        run: python scripts/prepare_terminal.py --github-env "$GITHUB_ENV"
      - name: Initialize two isolated kubeconfig paths
        run: |
          echo "ASTER_MULTI_KUBECONFIG_A=$RUNNER_TEMP/aster-east-kubeconfig" >> "$GITHUB_ENV"
          echo "ASTER_MULTI_KUBECONFIG_B=$RUNNER_TEMP/aster-west-kubeconfig" >> "$GITHUB_ENV"
      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@v0.33.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Create two independent control planes
        run: |
          kind create cluster --name aster-e2e-east --kubeconfig "$ASTER_MULTI_KUBECONFIG_A" --image 'kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5' --wait 120s
          kind create cluster --name aster-e2e-west --kubeconfig "$ASTER_MULTI_KUBECONFIG_B" --image 'kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5' --wait 120s
      - name: Native isolation, reviewed mutation and surviving watch
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/multicluster
          go version > artifacts/multicluster/environment.txt
          git rev-parse HEAD >> artifacts/multicluster/environment.txt
          kubectl --kubeconfig "$ASTER_MULTI_KUBECONFIG_A" version >> artifacts/multicluster/environment.txt
          kubectl --kubeconfig "$ASTER_MULTI_KUBECONFIG_B" version >> artifacts/multicluster/environment.txt
          go test -race -tags=e2e,multicluster -run '^TestNativeIndependentWorkspacesAgainstTwoRealClusters$' -count=1 -timeout=8m -json ./internal/ui | tee artifacts/multicluster/tests.jsonl
          python3 scripts/test_evidence.py artifacts/multicluster/tests.jsonl --suite two-real-clusters --require TestNativeIndependentWorkspacesAgainstTwoRealClusters
      - name: Collect two-cluster diagnostics
        if: always()
        run: |
          mkdir -p artifacts/multicluster
          kubectl --kubeconfig "$ASTER_MULTI_KUBECONFIG_A" get pods -A -o wide > artifacts/multicluster/east-pods.txt 2>&1 || true
          kubectl --kubeconfig "$ASTER_MULTI_KUBECONFIG_B" get pods -A -o wide > artifacts/multicluster/west-pods.txt 2>&1 || true
      - name: Delete both isolated clusters
        if: always()
        run: |
          kind delete cluster --name aster-e2e-east
          kind delete cluster --name aster-e2e-west
      - name: Upload multi-cluster evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: two-cluster-evidence
          path: artifacts/multicluster
          retention-days: 14
