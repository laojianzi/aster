name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go test / race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true
      - name: Tidy module graph
        run: go mod tidy
      - name: Upload module snapshot
        uses: actions/upload-artifact@v4
        with:
          name: go-modules
          path: |
            go.mod
            go.sum
      - name: Sync module lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- go.mod go.sum && git ls-files --error-unmatch go.sum >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "build: lock Go dependencies"
          git push origin "HEAD:${{ github.head_ref }}"
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Verify module graph
        run: git diff --exit-code -- go.mod go.sum

  kind-e2e:
    name: kind e2e / Kubernetes ${{ matrix.k8s }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - k8s: "v1.35.8"
            image: "kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0"
          - k8s: "v1.36.4"
            image: "kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed"
          - k8s: "v1.37.0"
            image: "kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true
      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@v0.33.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Create cluster
        run: kind create cluster --image "${{ matrix.image }}" --wait 120s
      - name: Cluster diagnostics
        run: kubectl version && kubectl get nodes -o wide
      - name: Prepare modules
        run: go mod tidy
      - name: E2E
        run: go test -tags=e2e ./e2e/... -count=1 -timeout=10m
