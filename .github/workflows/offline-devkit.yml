name: Offline development kit
# Refresh public toolchain/module snapshots when pinned dependency inputs change.

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - .github/workflows/offline-devkit.yml
      - go.mod
      - go.sum
      - internal/nativeterm/UPSTREAM.json
      - internal/nativeterm/hardening.patch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
      - name: Prepare hash-verified native terminal source and library
        shell: bash
        run: python scripts/prepare_terminal.py --github-env "$GITHUB_ENV"
      - name: Verify and package only the toolchain and public module source
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          go mod vendor
          mkdir -p kit/evidence kit/source output
          cp -a "$(go env GOROOT)" kit/go
          mv vendor kit/source/vendor
          cp go.mod go.sum kit/source/
          go version > kit/evidence/environment.txt
          git rev-parse HEAD >> kit/evidence/environment.txt
          go list -m -mod=mod all > kit/evidence/modules.txt
          git archive --format=tar HEAD | tar -xf - -C kit/source
          mkdir -p kit/source/internal/nativeterm
          cp -a internal/nativeterm/upstream kit/source/internal/nativeterm/
          cp -a .aster-native kit/source/
          tar -czf output/aster-offline-devkit-linux-amd64.tar.gz -C kit .
          cd output
          sha256sum aster-offline-devkit-linux-amd64.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-devkit-linux-amd64
          path: output/
          if-no-files-found: error
          retention-days: 2
