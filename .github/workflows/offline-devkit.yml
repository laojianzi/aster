name: Offline development kit
# Refresh public toolchain/module snapshots when pinned dependency inputs change.

on:
  push:
    branches: [main, 'feat/**', 'renovate/**']
    paths:
      - .github/workflows/offline-devkit.yml
      - go.mod
      - go.sum
      - third_party/native-terminal/UPSTREAM.json
      - third_party/native-terminal/hardening.patch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mygo-history-review:
    # Temporary review-input collection; never a product qualification gate.
    if: github.ref == 'refs/heads/renovate/mygo-native-framework'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
      - name: Collect fixed public module snapshots and complete Git ancestry
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/mygo-history"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/ASTER_COMMIT"
          go version > "$out/environment.txt"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          for version in v0.3.0 v0.3.7 v0.4.0 v0.4.8 v0.5.0 v0.5.1; do
            go mod download -json "github.com/egoist/mygo@$version" > "$out/$version.json"
            module_dir=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["Dir"])' "$out/$version.json")
            module_zip=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["Zip"])' "$out/$version.json")
            cp "$module_zip" "$out/$version.module.zip"
            tar -czf "$out/$version.source.tar.gz" -C "$module_dir" .
          done
          git init --bare upstream.git
          git -C upstream.git fetch --no-tags https://github.com/egoist/mygo.git \
            refs/tags/v0.3.0:refs/tags/v0.3.0 refs/tags/v0.3.7:refs/tags/v0.3.7 \
            refs/tags/v0.4.0:refs/tags/v0.4.0 refs/tags/v0.4.8:refs/tags/v0.4.8 \
            refs/tags/v0.5.0:refs/tags/v0.5.0 refs/tags/v0.5.1:refs/tags/v0.5.1
          test "$(git -C upstream.git rev-parse v0.3.0)" = c9c1bc6c73d7c57a163c31d73230f845a9853ce3
          test "$(git -C upstream.git rev-parse v0.4.8)" = c0e1068027faf8b14777c9cb925c937ef34ac2bb
          test "$(git -C upstream.git rev-parse v0.5.1)" = 408b4def1f3e6a8d3fac852396b4a46d82ba22a3
          git -C upstream.git fsck --full --strict
          git -C upstream.git bundle create "$out/upstream.bundle" --all
          git -C upstream.git log --reverse --format='%H%x09%s' v0.3.0..v0.5.1 > "$out/commits.tsv"
          git -C upstream.git diff --name-status v0.3.0 v0.5.1 > "$out/files-03-05.tsv"
          git -C upstream.git diff --name-status v0.4.8 v0.5.1 > "$out/files-048-05.tsv"
          git -C upstream.git show-ref > "$out/refs.txt"
          cd "$out"
          sha256sum *.json *.zip *.tar.gz *.bundle *.tsv *.txt ASTER_COMMIT > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mygo-03-05-review-inputs
          path: mygo-history/
          if-no-files-found: error
          retention-days: 2
  devkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
      - name: Retain public upstream inputs for manual compatibility review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream-review
          mygo_version=$(python -c 'import json; print(json.load(open("third_party/native-terminal/UPSTREAM.json"))["version"])')
          go mod download -json "github.com/egoist/mygo@$mygo_version" > upstream-review/module.json
          module_dir=$(python -c 'import json; print(json.load(open("upstream-review/module.json"))["Dir"])')
          tar -czf upstream-review/mygo-module.tar.gz -C "$module_dir" .
          cp go.mod go.sum upstream-review/
          git rev-parse HEAD > upstream-review/COMMIT
          (cd upstream-review && sha256sum mygo-module.tar.gz go.mod go.sum > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-review-inputs
          path: upstream-review/
          if-no-files-found: error
          retention-days: 2
      - name: Prepare hash-verified native terminal source and library
        shell: bash
        run: python scripts/prepare_terminal.py --github-env "$GITHUB_ENV"
      - name: Verify and package only the toolchain and public module source
        shell: bash
        run: |
          set -euo pipefail
          # Resolve full checksums for the pinned graph, including new imports.
          # This read-only devkit records changes; final test CI requires none.
          go mod download all
          go mod verify
          go mod vendor
          mkdir -p kit/evidence kit/source output
          cp -a "$(go env GOROOT)" kit/go
          mv vendor kit/source/vendor
          cp go.mod go.sum kit/source/
          # Preserve resolved metadata separately from the exact git archive.
          # The archive below intentionally restores the tracked source snapshot.
          mkdir -p kit/evidence/resolved
          cp go.mod go.sum kit/evidence/resolved/
          go version > kit/evidence/environment.txt
          git rev-parse HEAD >> kit/evidence/environment.txt
          go list -m -mod=mod all > kit/evidence/modules.txt
          git archive --format=tar HEAD | tar -xf - -C kit/source
          mkdir -p kit/source/internal/nativeterm
          cp -a internal/nativeterm/upstream kit/source/internal/nativeterm/
          cp -a .aster-native kit/source/
          tar -czf output/aster-offline-devkit-linux-amd64.tar.gz -C kit .
          cd output
          sha256sum aster-offline-devkit-linux-amd64.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-devkit-linux-amd64
          path: output/
          if-no-files-found: error
          retention-days: 2
