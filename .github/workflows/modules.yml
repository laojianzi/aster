name: Module Snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
      - run: go mod tidy
      - uses: actions/upload-artifact@v4
        with:
          name: go-modules
          path: |
            go.mod
            go.sum
          if-no-files-found: error
